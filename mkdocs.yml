site_name: Cybersecurity Homelab Documentation
site_description: Technical documentation for a hands-on cybersecurity and networking homelab.
site_author: Christian Sterneborn
site_url: https://cv.sterneborn.org/docs/

docs_dir: documentation
site_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: blue
      accent: light blue

extra:
