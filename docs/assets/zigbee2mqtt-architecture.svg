<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Planned Zigbee2MQTT architecture</title>
  <desc id="desc">Zigbee devices communicate through a coordinator and Zigbee2MQTT to an MQTT broker and Home Assistant, with IoT and Lab and Servers trust boundaries enforced by the UniFi firewall.</desc>
  <style>
    .bg{fill:#0f172a}.zone{fill:#111827;stroke:#334155;stroke-width:2;stroke-dasharray:9 8}.card{fill:#172033;stroke:#475569;stroke-width:2}.planned{fill:#312e81;stroke:#a78bfa;stroke-width:3}.line{fill:none;stroke:#a78bfa;stroke-width:4;stroke-linecap:round}.h{fill:#f8fafc;font-size:23px;font-weight:700}.p{fill:#cbd5e1;font-size:18px;font-weight:500}.s{fill:#94a3b8;font-size:16px;font-weight:400}.t{fill:#f8fafc;font-size:38px;font-weight:700}.e{fill:#a78bfa;font-size:15px;font-weight:700;letter-spacing:2px}
  </style>
  <rect width="1400" height="700" rx="28" class="bg"/>
  <text x="64" y="66" class="e">PLANNED ARCHITECTURE</text>
  <text x="64" y="116" class="t">Zigbee2MQTT + Home Assistant</text>
  <text x="64" y="150" class="s">Local device control across explicit UniFi trust boundaries</text>
  <rect x="52" y="205" width="518" height="382" rx="24" class="zone"/>
  <text x="82" y="246" class="e">IOT ZONE</text>
  <rect x="88" y="292" width="190" height="124" rx="18" class="card"/>
  <text x="183" y="339" text-anchor="middle" class="h">Zigbee devices</text>
  <text x="183" y="374" text-anchor="middle" class="s">Sensors · Switches</text>
  <rect x="278" y="352" width="62" height="4" fill="#a78bfa"/>
  <rect x="340" y="292" width="194" height="124" rx="18" class="planned"/>
  <text x="437" y="339" text-anchor="middle" class="h">Coordinator</text>
  <text x="437" y="374" text-anchor="middle" class="s">Zigbee radio</text>
  <text x="82" y="530" class="s">Isolated smart-home network</text>
  <rect x="638" y="205" width="710" height="382" rx="24" class="zone"/>
  <text x="668" y="246" class="e">LAB / SERVERS ZONE</text>
  <rect x="674" y="292" width="190" height="124" rx="18" class="planned"/>
  <text x="769" y="339" text-anchor="middle" class="h">Zigbee2MQTT</text>
  <text x="769" y="374" text-anchor="middle" class="s">Device bridge</text>
  <rect x="534" y="352" width="140" height="4" fill="#a78bfa"/>
  <rect x="918" y="292" width="176" height="124" rx="18" class="planned"/>
  <text x="1006" y="339" text-anchor="middle" class="h">MQTT</text>
  <text x="1006" y="374" text-anchor="middle" class="s">Broker</text>
  <rect x="864" y="352" width="54" height="4" fill="#a78bfa"/>
  <rect x="1148" y="292" width="164" height="124" rx="18" class="card"/>
  <text x="1230" y="339" text-anchor="middle" class="h">Home</text>
  <text x="1230" y="369" text-anchor="middle" class="h">Assistant</text>
  <rect x="1094" y="352" width="54" height="4" fill="#a78bfa"/>
  <text x="668" y="530" class="s">Explicit firewall policy · Monitoring · Backup and recovery</text>
  <rect x="350" y="620" width="700" height="50" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="700" y="652" text-anchor="middle" class="p">Status: planned — coordinator and host placement still to be validated</text>
</svg>
