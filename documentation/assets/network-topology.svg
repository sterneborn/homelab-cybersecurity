<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Current UniFi homelab network topology</title>
  <desc id="desc">Internet connects to a UniFi Cloud Gateway Ultra and zone-based firewall serving five VLANs. WireGuard is a separate VPN path. A remote client uses the Twingate service and an outbound Connector in VLAN 50 to reach approved resources in VLAN 30 without joining VLAN 50.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#050913"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#020617" flood-opacity="0.52"/></filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#45c6f4"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b59cf6"/></marker>
    <style>.title{fill:#f8fbff;font:700 44px Inter,system-ui,sans-serif}.subtitle{fill:#a8b5c7;font:400 20px Inter,system-ui,sans-serif}.heading{fill:#f8fbff;font:700 22px Inter,system-ui,sans-serif}.label{fill:#c7d2e1;font:500 17px Inter,system-ui,sans-serif}.small{fill:#a8b5c7;font:400 15px Inter,system-ui,sans-serif}.eyebrow{fill:#45c6f4;font:700 15px Inter,system-ui,sans-serif;letter-spacing:2px}.vlan{fill:#a8b5c7;font:700 14px Inter,system-ui,sans-serif;letter-spacing:1px}.card{fill:#111b2e;stroke:#2a3c55;stroke-width:2}.primary{fill:#0c4a6e;stroke:#45c6f4;stroke-width:3}.line{fill:none;stroke:#45c6f4;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.access{fill:none;stroke:#b59cf6;stroke-width:3;stroke-dasharray:9 8;stroke-linecap:round;stroke-linejoin:round}.policy{fill:#172554;stroke:#60a5fa;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="1100" rx="34" fill="url(#background)"/><text x="64" y="66" class="eyebrow">CURRENT ARCHITECTURE</text><text x="64" y="116" class="title">UniFi Homelab Network</text><text x="64" y="151" class="subtitle">Five segmented networks · layered policy · two distinct remote-access models</text>
  <rect x="690" y="50" width="220" height="68" rx="16" class="card"/><circle cx="730" cy="84" r="13" fill="#45c6f4"/><text x="762" y="92" class="heading">Internet</text><path d="M800 118V200" class="line" marker-end="url(#arrow-cyan)"/>
  <rect x="535" y="200" width="530" height="104" rx="20" class="primary" filter="url(#shadow)"/><text x="800" y="243" text-anchor="middle" class="heading">UniFi Cloud Gateway Ultra</text><text x="800" y="275" text-anchor="middle" class="label">Gateway · Router · UniFi Network</text>
  <rect x="50" y="206" width="270" height="92" rx="18" class="card"/><text x="76" y="245" class="heading">WireGuard VPN</text><text x="76" y="275" class="small">Separate tunnel + routing path</text><path d="M320 252H535" class="access" marker-end="url(#arrow-purple)"/>
  <rect x="1280" y="206" width="270" height="92" rx="18" class="card"/><text x="1306" y="245" class="heading">UniFi U7 Lite</text><text x="1306" y="275" class="small">Managed AP · VLAN-backed SSIDs</text><path d="M1065 252H1280" class="line" marker-end="url(#arrow-cyan)"/>
  <path d="M800 304V352" class="line"/><rect x="445" y="352" width="710" height="78" rx="16" class="policy"/><text x="800" y="383" text-anchor="middle" class="heading">UniFi zone-based firewall</text><text x="800" y="412" text-anchor="middle" class="small">Default isolation · explicit required access · stateful return traffic</text><path d="M800 430V470M180 470H1420M180 470V502M490 470V502M800 470V502M1110 470V502M1420 470V502" class="line"/>
  <rect x="40" y="502" width="280" height="212" rx="18" class="card"/><rect x="40" y="502" width="280" height="10" rx="5" fill="#57d394"/><text x="66" y="548" class="vlan">VLAN 10</text><text x="66" y="584" class="heading">Trusted</text><text x="66" y="618" class="label">Personal devices</text><text x="66" y="647" class="label">Administrative clients</text><text x="66" y="681" class="small">Approved service access</text>
  <rect x="350" y="502" width="280" height="212" rx="18" class="card"/><rect x="350" y="502" width="280" height="10" rx="5" fill="#f5c451"/><text x="376" y="548" class="vlan">VLAN 20</text><text x="376" y="584" class="heading">Guest</text><text x="376" y="618" class="label">Visitor devices</text><text x="376" y="647" class="label">Internet only</text><text x="376" y="681" class="small">Private networks blocked</text>
  <rect x="660" y="502" width="280" height="212" rx="18" class="card"/><rect x="660" y="502" width="280" height="10" rx="5" fill="#45c6f4"/><text x="686" y="548" class="vlan">VLAN 30</text><text x="686" y="584" class="heading">Lab / Servers</text><text x="686" y="618" class="label">Proxmox · VMs · Docker</text><text x="686" y="647" class="label">Approved Resources</text><text x="686" y="681" class="small">Host firewalls narrow services</text>
  <rect x="970" y="502" width="280" height="212" rx="18" class="card"/><rect x="970" y="502" width="280" height="10" rx="5" fill="#b59cf6"/><text x="996" y="548" class="vlan">VLAN 40</text><text x="996" y="584" class="heading">IoT</text><text x="996" y="618" class="label">Smart-home devices</text><text x="996" y="647" class="label">Home Assistant</text><text x="996" y="681" class="small">Required exceptions only</text>
  <rect x="1280" y="502" width="280" height="212" rx="18" fill="#171b31" stroke="#fb7185" stroke-width="2"/><rect x="1280" y="502" width="280" height="10" rx="5" fill="#fb7185"/><text x="1306" y="548" class="vlan">VLAN 50</text><text x="1306" y="584" class="heading">Remote Access</text><rect x="1304" y="604" width="232" height="64" rx="12" fill="#27223d" stroke="#b59cf6" stroke-width="2"/><text x="1420" y="631" text-anchor="middle" class="label">Debian LXC Connector</text><text x="1420" y="654" text-anchor="middle" class="small">Native systemd service</text><text x="1306" y="695" class="small">Connector only · no client address</text>
  <rect x="1015" y="58" width="200" height="64" rx="15" class="card"/><text x="1115" y="85" text-anchor="middle" class="heading">Remote client</text><text x="1115" y="107" text-anchor="middle" class="small">Does not join VLAN 50</text><rect x="1300" y="58" width="235" height="64" rx="15" class="card"/><text x="1418" y="85" text-anchor="middle" class="heading">Twingate service</text><text x="1418" y="107" text-anchor="middle" class="small">Identity + Resource decision</text><path d="M1215 90H1300" class="access" marker-end="url(#arrow-purple)"/><path d="M1536 636H1572V90H1535" class="access" marker-end="url(#arrow-purple)"/><text x="1298" y="151" class="small">Outbound Connector connection</text>
  <path d="M1420 668V754H800V714" class="access" marker-end="url(#arrow-purple)"/><rect x="972" y="730" width="290" height="42" rx="10" fill="#27223d" stroke="#b59cf6"/><text x="1117" y="757" text-anchor="middle" class="small">Only approved Resource flows</text>
  <rect x="60" y="824" width="1480" height="206" rx="22" fill="#111b2e" stroke="#26364d" stroke-width="2"/><text x="92" y="866" class="eyebrow">LAB / SERVERS AND OPERATIONS</text><text x="92" y="912" class="heading">Proxmox &amp; Linux</text><text x="425" y="912" class="heading">Core Services</text><text x="790" y="912" class="heading">Monitoring</text><text x="1170" y="912" class="heading">Automation</text><text x="92" y="946" class="small">VMs · Debian LXC · Ubuntu</text><text x="425" y="946" class="small">Home Assistant · AdGuard</text><text x="790" y="946" class="small">Prometheus · Grafana</text><text x="1170" y="946" class="small">n8n · Knut</text><text x="92" y="979" class="small">Docker · Portainer · backups</text><text x="425" y="979" class="small">SSH · self-hosted apps</text><text x="790" y="979" class="small">Uptime Kuma · SmokePing</text><text x="1170" y="979" class="small">Controlled workflows</text><text x="800" y="1010" text-anchor="middle" class="small">Secrets, tokens, private addresses and account details intentionally omitted</text>
</svg>
